# Pre-commit hooks for autoware-index.
#
# This file is repo-owned (NOT synced from sync-file-templates): on top of
# the shared template hooks it carries the registry hooks that mirror
# .github/workflows/validate.yaml, which a file sync would wipe.

# https://pre-commit.ci/#configuration
ci:
  autofix_commit_msg: "style(pre-commit): autofix"
  autoupdate_schedule: quarterly
  autoupdate_commit_msg: "ci(pre-commit): quarterly autoupdate"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--unsafe]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args: [-c, .markdownlint.yaml, --fix]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        args: [--no-error-on-unmatched-pattern]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/autowarefoundation/autoware-guideline-check
    rev: 0.2.0
    hooks:
      - id: check-package-depends
        # Upstream `files: package.xml` is an unanchored regex that also matches
        # our cache_package_xml.py scripts; scope it off Python files. This repo
        # tracks no real package.xml (the only one is in gitignored ros2_ws/).
        exclude: \.py$

  - repo: https://github.com/tier4/pre-commit-hooks-ros
    rev: v0.10.2
    hooks:
      - id: flake8-ros
      - id: prettier-xacro
      - id: prettier-launch-xml
      - id: prettier-package-xml
      - id: ros-include-guard
      - id: sort-package-xml

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [-w, -s, -i=4]

  - repo: https://github.com/pycqa/isort
    rev: 9.0.0a3
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        args: [--line-length=100]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.5
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]

  - repo: https://github.com/cpplint/cpplint
    rev: 2.0.2
    hooks:
      - id: cpplint
        args: [--quiet]
        exclude: .cu

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.2
    hooks:
      - id: check-metaschema
        files: ^.+/schema/.*schema\.json$

  - repo: local
    hooks:
      - id: prettier-svg
        name: prettier svg
        description: Apply Prettier with plugin-xml to svg.
        entry: prettier --write --list-different --ignore-unknown --print-width 200 --xml-self-closing-space false --xml-whitespace-sensitivity ignore
        language: node
        files: .svg$
        additional_dependencies: [prettier@2.7.1, "@prettier/plugin-xml@2.2.0"]

  - repo: https://github.com/autowarefoundation/autoware_system_designer
    rev: v0.3.2
    hooks:
      - id: lint-system-design-format
        args: [--format=github-actions]

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.14.0
    hooks:
      - id: hadolint
        exclude: .svg$

  # ------------------------------------------------------------------------
  # Repo-specific registry hooks below — they mirror validate.yaml and are
  # the reason this file is not synced.
  # ------------------------------------------------------------------------

  # Mirrors CI: distributions/*.yaml must conform to the registry schema.
  # (check-metaschema again because the synced pattern above requires a
  # nested */schema/ dir and never matches this repo's top-level schema/.)
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.2
    hooks:
      - id: check-metaschema
        name: registry schemas are valid JSON Schema
        files: ^schema/.*schema\.json$
      - id: check-jsonschema
        name: distributions conform to schema
        files: ^distributions/.*\.yaml$
        args: [--schemafile, schema/distribution.schema.json]

  # Mirrors CI: each distributions/<distro>.yaml's ros_distro field equals filename stem.
  - repo: local
    hooks:
      - id: ros-distro-filename
        name: ros_distro field matches filename stem
        entry: python scripts/check_distro_filename.py
        language: python
        additional_dependencies: [pyyaml]
        files: ^distributions/.*\.yaml$

  # Mirrors CI (offline subset): reject placeholder maintainers. Ref
  # resolvability needs network (git ls-remote) and runs in CI only, so the
  # local hook passes --no-network.
  - repo: local
    hooks:
      - id: check-refs-offline
        name: no placeholder maintainers
        entry: python scripts/check_refs.py --no-network
        language: python
        additional_dependencies: [pyyaml]
        files: ^distributions/.*\.yaml$

  # Mirrors CI: package tags come from the closed vocabulary. No filenames
  # are passed: editing EITHER a distro file or schema/tags.yaml re-checks
  # the whole registry (the script defaults to distributions/*.yaml), so a
  # rename PR that forgets to migrate usages fails locally too.
  - repo: local
    hooks:
      - id: check-tags
        name: package tags come from the vocabulary
        entry: python scripts/check_tags.py
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        files: ^(distributions/.*\.yaml|schema/tags\.yaml)$
