name: build-repository

# Build each registered package and its workspace-local dependency closure
# once. Package failures are data until Report, so successful siblings are
# cached and remain testable. Infrastructure faults leave outcomes null.
# Source lives under src/ to keep build outputs and cached manifests outside
# package trees (including repositories with a package.xml at their root).
#
# Artifact contract: validate-result-<distro>-<repo>-<version> contains a
# schema-2 result.json and pristine package-xmls/<package>.xml. This workflow
# publishes build outcomes with null test outcomes. The test workflow adds
# test outcomes and replaces that artifact before the recorder runs.

on:
  workflow_call:
    inputs:
      ros_distro:
        description: ROS 2 distribution (e.g. "jazzy").
        required: true
        type: string
      autoware_version:
        description: Resolved Autoware release, shared with the test workflow.
        required: true
        type: string
      repo_name:
        description: Registry key of the repository entry (artifact + record identity).
        required: true
        type: string
      repository:
        description: Git URL of the repository to clone.
        required: true
        type: string
      ref_kind:
        description: "Registered ref kind: tag | sha | branch (recorded in result.json)."
        required: true
        type: string
      ref_value:
        description: Tag, branch, or SHA of repository to check out.
        required: true
        type: string
      packages:
        description: Space-separated registered ROS package names hosted by this repository.
        required: true
        type: string
      dependency_repositories:
        description: JSON array of transitive registered repository dependencies.
        required: false
        type: string
        default: "[]"
      dependency_packages:
        description: Space-separated registered package dependencies to build explicitly.
        required: false
        type: string
        default: ""
      index_dependencies:
        description: JSON mapping of registered package dependency edges.
        required: false
        type: string
        default: "{}"
      base_image_stage:
        description: Container image stage. Defaults to core-devel.
        required: false
        type: string
        default: core-devel
      runs-on:
        description: |
          Runner label as a JSON-encoded array (workaround for the lack
          of array inputs in workflow_call). Default: '["ubuntu-24.04"]'.
        required: false
        type: string
        default: '["ubuntu-24.04"]'

    outputs:
      resolved_sha:
        description: Exact source commit built.
        value: ${{ jobs.build.outputs.resolved_sha }}
      has-tests:
        description: Whether any registered package built successfully.
        value: ${{ jobs.build.outputs.has-tests }}
      cache-key:
        description: Exact cache key produced by this build attempt.
        value: ${{ jobs.build.outputs.cache-key }}

permissions:
  contents: read

jobs:
  build:
    name: build (${{ inputs.ros_distro }}, autoware ${{ inputs.autoware_version }}, ${{ inputs.repo_name }})
    runs-on: ${{ fromJson(inputs.runs-on) }}
    container:
      image: ghcr.io/autowarefoundation/autoware:${{ inputs.base_image_stage }}-${{ inputs.ros_distro }}-${{ inputs.autoware_version }}
    outputs:
      resolved_sha: ${{ steps.resolve.outputs.sha }}
      has-tests: ${{ steps.handoff.outputs.has-tests }}
      cache-key: ${{ steps.handoff.outputs.cache-key }}
    steps:
      - name: Clone repository
        env:
          REPOSITORY: ${{ inputs.repository }}
          REF_VALUE: ${{ inputs.ref_value }}
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          # The container runs as a different user than owns the mounted
          # workspace, so git refuses operations here ("dubious ownership").
          # Mark it safe before later git-based steps.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}/src/repository"
          mkdir -p src
          git clone "${REPOSITORY}" src/repository
          git -C src/repository checkout "${REF_VALUE}"

      - name: Clone index dependencies
        env:
          DEPENDENCY_REPOSITORIES: ${{ inputs.dependency_repositories }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json
          import os
          from pathlib import Path
          import subprocess

          dependencies = json.loads(os.environ["DEPENDENCY_REPOSITORIES"] or "[]") or []
          for dependency in dependencies:
              name = dependency["repo_name"]
              path = Path(os.environ["GITHUB_WORKSPACE"]) / "src" / "index-dependencies" / name
              path.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(["git", "config", "--global", "--add", "safe.directory", str(path)], check=True)
              subprocess.run(["git", "clone", dependency["repository"], str(path)], check=True)
              subprocess.run(["git", "-C", str(path), "checkout", dependency["ref_value"]], check=True)
          EOF

      - name: Record index dependency closures
        env:
          INDEX_DEPENDENCIES: ${{ inputs.index_dependencies }}
          PACKAGES: ${{ inputs.packages }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json
          import os
          from pathlib import Path

          graph = json.loads(os.environ["INDEX_DEPENDENCIES"] or "{}") or {}
          directory = Path(".index-closures")
          directory.mkdir()
          for package in os.environ["PACKAGES"].split():
              closure = set()
              pending = list(graph.get(package, []))
              while pending:
                  dependency = pending.pop()
                  if dependency in closure:
                      continue
                  closure.add(dependency)
                  pending.extend(graph.get(dependency, []))
              (directory / package).write_text("".join(f"{name}\n" for name in sorted(closure)))
          EOF

      - name: Resolve commit SHA
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          echo "sha=$(git -C src/repository rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Scan workspace for registered packages
        # Runs BEFORE remove-exec-depend so package-xmls/ caches the pristine
        # upstream package.xml, not the build-mangled one.
        id: scan
        env:
          PACKAGES: ${{ inputs.packages }}
          DEPENDENCY_PACKAGES: ${{ inputs.dependency_packages }}
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          mkdir -p package-xmls
          # Enumerate as a checked command (not a process substitution, whose
          # failure would be silently swallowed and misreport every package
          # as absent): a colcon error fails the step loudly instead.
          colcon list --base-paths src > .colcon-list.txt
          declare -A pkg_path
          while IFS=$'\t' read -r name path _type; do
            if [[ -n "${pkg_path[$name]:-}" ]]; then
              echo "::warning::duplicate package name '${name}' in the tree (${pkg_path[$name]} and ${path}); colcon will refuse to build it"
            fi
            pkg_path["$name"]="$path"
          done < .colcon-list.txt

          present=()
          absent=()
          for pkg in ${PACKAGES}; do
            if [[ -n "${pkg_path[$pkg]:-}" ]]; then
              present+=("$pkg")
              cp "${pkg_path[$pkg]}/package.xml" "package-xmls/${pkg}.xml"
            else
              absent+=("$pkg")
              echo "::error::registered package '${pkg}' not found in the repository tree at this ref"
            fi
          done

          deps_present=()
          : > .sweep-index-missing.txt
          for pkg in ${DEPENDENCY_PACKAGES}; do
            if [[ -n "${pkg_path[$pkg]:-}" ]]; then
              deps_present+=("$pkg")
            else
              echo "$pkg" >> .sweep-index-missing.txt
              echo "::error::index dependency '${pkg}' not found in the imported source tree"
            fi
          done

          echo "present=${present[*]:-}" >> "${GITHUB_OUTPUT}"
          echo "absent=${absent[*]:-}" >> "${GITHUB_OUTPUT}"
          echo "deps_present=${deps_present[*]:-}" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${present[@]:-}" | sed '/^$/d' > .sweep-present.txt
          printf '%s\n' "${absent[@]:-}" | sed '/^$/d' > .sweep-absent.txt
          echo "found ${#present[@]} present / ${#absent[@]} absent of $(wc -w <<< "${PACKAGES}") registered package(s)"

      - name: Remove exec_depend
        if: steps.scan.outputs.present != ''
        uses: autowarefoundation/autoware-github-actions/remove-exec-depend@v1

      - name: Install dependencies (rosdep)
        if: steps.scan.outputs.present != ''
        env:
          ROS_DISTRO_INPUT: ${{ inputs.ros_distro }}
          PRESENT: ${{ steps.scan.outputs.present }}
          DEPS_PRESENT: ${{ steps.scan.outputs.deps_present }}
        shell: bash
        # No nounset here or in the build/verdict steps: colcon- and
        # ament-generated setup.sh scripts reference unset variables
        # (COLCON_TRACE, AMENT_PYTHON_EXECUTABLE, ...) and abort the shell
        # under `set -u` the moment they are sourced.
        run: |
          set -eo pipefail
          cd "${GITHUB_WORKSPACE}"
          : > .sweep-failed.txt
          apt-get -yqq update
          rosdep update || echo "::warning::rosdep update failed; using the image's existing sources"
          # shellcheck disable=SC2086
          package_paths=$(colcon list -p --packages-up-to ${PRESENT} ${DEPS_PRESENT} --base-paths src)
          if [ -f /opt/autoware/setup.sh ]; then
            . /opt/autoware/setup.sh
          fi
          # rosdep's exit code is DATA, not a job verdict: a key it cannot
          # resolve is a defect in the declaring package's OWN manifest. Seed
          # those packages into .sweep-failed.txt so the verdict step fails
          # them (and their dependents) through the usual closure check, then
          # retry without their keys so one bad manifest cannot blind its
          # siblings. A failure naming no key is an infrastructure fault:
          # leave every outcome null and go red without attributing.
          # shellcheck disable=SC2086
          if ! DEBIAN_FRONTEND=noninteractive rosdep install -yqq \
              --from-paths ${package_paths} --ignore-src --rosdistro "${ROS_DISTRO_INPUT}" \
              > .sweep-rosdep.log 2>&1; then
            cat .sweep-rosdep.log
            sed -n '/could not have their rosdep keys resolved/,$p' .sweep-rosdep.log \
              | sed -n 's/^\([^[:space:]:]*\): Cannot locate rosdep definition for \[\(.*\)\]$/\1 \2/p' \
              > .sweep-unresolved.txt
            if [ ! -s .sweep-unresolved.txt ]; then
              echo "::error::rosdep install failed without naming an unresolvable key; infrastructure fault, all outcomes inconclusive"
              exit 1
            fi
            awk '{print $1}' .sweep-unresolved.txt | sort -u > .sweep-failed.txt
            skip_keys=$(awk '{print $2}' .sweep-unresolved.txt | sort -u | paste -sd' ')
            echo "::error::unresolvable rosdep key(s) [${skip_keys}] declared by: $(paste -sd' ' .sweep-failed.txt)"
            # shellcheck disable=SC2086
            DEBIAN_FRONTEND=noninteractive rosdep install -yqq \
              --from-paths ${package_paths} --ignore-src --rosdistro "${ROS_DISTRO_INPUT}" \
              --skip-keys "${skip_keys}"
          fi

      - name: Build (union of registered packages)
        if: steps.scan.outputs.present != ''
        env:
          ROS_DISTRO_INPUT: ${{ inputs.ros_distro }}
          PRESENT: ${{ steps.scan.outputs.present }}
          DEPS_PRESENT: ${{ steps.scan.outputs.deps_present }}
        shell: bash
        run: |
          set -eo pipefail
          cd "${GITHUB_WORKSPACE}"
          # shellcheck disable=SC1090
          . "/opt/ros/${ROS_DISTRO_INPUT}/setup.sh"
          if [ -f /opt/autoware/setup.sh ]; then
            . /opt/autoware/setup.sh
          fi
          # Each present package and its workspace-local dependencies build
          # exactly once; --continue-on-error keeps independent siblings
          # building after one fails. The build's exit code is DATA, not a
          # job verdict (per-package attribution happens in the next step),
          # so errexit (implied by `shell: bash`) must be suspended around
          # the pipeline or a failing package would abort this step before
          # PIPESTATUS is read and no honest `fail` could ever be recorded.
          set +e
          # shellcheck disable=SC2086
          colcon build \
            --event-handlers console_cohesion+ \
            --packages-up-to ${PRESENT} ${DEPS_PRESENT} \
            --continue-on-error \
            --cmake-args -DCMAKE_BUILD_TYPE=Release \
            --base-paths src 2>&1 | tee .sweep-build.log
          build_rc=${PIPESTATUS[0]}
          set -e
          # Append: the rosdep step may already have seeded this file with
          # packages whose manifests declare an unresolvable key.
          grep -E '^(Failed|Aborted)[[:space:]]+<<<' .sweep-build.log \
            | awk '{print $3}' | sort -u >> .sweep-failed.txt || true
          if ! grep -q '^Summary:' .sweep-build.log; then
            # colcon always prints a Summary line when it actually ran; its
            # absence means the build never executed (broken env/image/disk).
            # That is an infrastructure fault: leave every outcome null
            # (inconclusive, the recorder skips loudly) instead of letting
            # the verdict step's install-dir checks fabricate per-package
            # failures out of a pipeline problem.
            echo "::error::colcon build produced no summary; infrastructure fault, all outcomes inconclusive"
            exit 1
          fi
          if [ "${build_rc}" -ne 0 ] && [ ! -s .sweep-failed.txt ]; then
            echo "::warning::colcon build exited ${build_rc} without naming failed packages; install-dir checks will attribute"
          fi
          echo "build exited ${build_rc}; failed/aborted: $(paste -sd' ' .sweep-failed.txt || true)"

      - name: Derive per-package build verdicts
        if: steps.scan.outputs.present != ''
        env:
          ROS_DISTRO_INPUT: ${{ inputs.ros_distro }}
        shell: bash
        run: |
          set -eo pipefail
          cd "${GITHUB_WORKSPACE}"
          # shellcheck disable=SC1090
          . "/opt/ros/${ROS_DISTRO_INPUT}/setup.sh"
          if [ -f /opt/autoware/setup.sh ]; then
            . /opt/autoware/setup.sh
          fi
          : > .sweep-results.txt
          while IFS= read -r pkg; do
            closure=$(colcon list --names-only --packages-up-to "${pkg}" --base-paths src)
            # Index edges can include exec-only ROS dependencies removed from
            # package.xml before the build. Include the registered closure
            # explicitly when attributing failed or missing prerequisites.
            closure="${closure}"$'\n'"$(cat ".index-closures/${pkg}" 2>/dev/null || true)"
            failed_dep=$(grep -Fx -f .sweep-failed.txt <<< "${closure}" | head -n1 || true)
            missing_dep=$(grep -Fx -f .sweep-index-missing.txt <<< "${closure}" | head -n1 || true)
            uninstalled_dep=""
            while IFS= read -r member; do
              if [ -n "${member}" ] && [ ! -d "install/${member}" ]; then
                uninstalled_dep="${member}"
                break
              fi
            done <<< "${closure}"
            if [ -n "${failed_dep}" ] || [ -n "${missing_dep}" ] || [ -n "${uninstalled_dep}" ]; then
              echo "${pkg} failure skipped" >> .sweep-results.txt
              echo "::error::${pkg}: build failure (closure member: ${failed_dep:-${missing_dep:-${uninstalled_dep}}})"
              continue
            fi
            echo "${pkg} success skipped" >> .sweep-results.txt
          done < .sweep-present.txt
          column -t .sweep-results.txt || cat .sweep-results.txt

      - name: Compose result.json
        if: always()
        env:
          ROS_DISTRO_INPUT: ${{ inputs.ros_distro }}
          AUTOWARE_VERSION: ${{ inputs.autoware_version }}
          REPO_NAME: ${{ inputs.repo_name }}
          REPOSITORY: ${{ inputs.repository }}
          REF_KIND: ${{ inputs.ref_kind }}
          REF_VALUE: ${{ inputs.ref_value }}
          RESOLVED_SHA: ${{ steps.resolve.outputs.sha }}
          PACKAGES: ${{ inputs.packages }}
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE}"
          python3 - <<'EOF'
          import json
          import os
          from pathlib import Path

          # build_outcome/test_outcome lines written by the verdict step;
          # packages never reaching it (absent, or the build steps were
          # skipped/cancelled) get explicit nulls; the recorder treats
          # those as inconclusive, never as pass or fail.
          results = {}
          results_file = Path(".sweep-results.txt")
          if results_file.is_file():
              for line in results_file.read_text().splitlines():
                  pkg, build, test = line.split()
                  results[pkg] = {
                      "build_outcome": build,
                      "test_outcome": None if test == "skipped" else test,
                  }

          present = set()
          present_file = Path(".sweep-present.txt")
          if present_file.is_file():
              present = set(present_file.read_text().split())

          packages = {}
          for pkg in os.environ["PACKAGES"].split():
              outcome = results.get(pkg, {"build_outcome": None, "test_outcome": None})
              packages[pkg] = {"present": pkg in present, **outcome}

          result = {
              "schema": 2,
              "ros_distro": os.environ["ROS_DISTRO_INPUT"],
              "autoware_version": os.environ["AUTOWARE_VERSION"],
              "repo_name": os.environ["REPO_NAME"],
              "repository": os.environ["REPOSITORY"],
              "ref": {"kind": os.environ["REF_KIND"], "value": os.environ["REF_VALUE"]},
              "resolved_sha": os.environ["RESOLVED_SHA"],
              "packages": packages,
          }
          Path("result.json").write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          EOF

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validate-result-${{ inputs.ros_distro }}-${{ inputs.repo_name }}-${{ inputs.autoware_version }}
          path: |
            result.json
            package-xmls/
          if-no-files-found: error
          # A manual re-run of a failed leg produces the same artifact name;
          # without overwrite the fresh attempt's upload would conflict and
          # the recorder would keep matching the stale attempt's result.json.
          overwrite: true

      - name: Prepare build handoff
        id: handoff
        env:
          # Each row and build attempt owns its cache. Passing this output
          # (rather than recomputing run_attempt in test) also supports
          # re-running just the failed test job against the original build.
          CACHE_KEY: sweep-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ros_distro }}-${{ inputs.repo_name }}-${{ inputs.autoware_version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .sweep-results.txt ] && grep -q ' success skipped$' .sweep-results.txt; then
            echo "has-tests=true" >> "${GITHUB_OUTPUT}"
            echo "cache-key=${CACHE_KEY}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Cache built workspace
        if: steps.handoff.outputs.has-tests == 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.handoff.outputs.cache-key }}
          # Preserve source and absolute build paths for CTest, generated
          # setup scripts, and symlinks. The test job uses the same container
          # and workspace location, and reinstalls system dependencies.
          path: |
            src
            build
            install
            .index-closures

      - name: Report
        if: always()
        env:
          REPO_NAME: ${{ inputs.repo_name }}
          REF_KIND: ${{ inputs.ref_kind }}
          REF_VALUE: ${{ inputs.ref_value }}
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          fail=0
          if [ -s .sweep-absent.txt ]; then
            echo "::error::registered package(s) missing from the tree: $(paste -sd' ' .sweep-absent.txt)"
            fail=1
          fi
          if [ -f .sweep-results.txt ] && grep -qE ' (failure)( |$)' .sweep-results.txt; then
            fail=1
          fi
          {
            echo "### build ${REPO_NAME} @ ${REF_KIND} ${REF_VALUE}"
            echo ""
            echo "| package | present | build |"
            echo "|---|---|---|"
            while IFS= read -r pkg; do
              line=$(grep "^${pkg} " .sweep-results.txt 2>/dev/null || true)
              if [ -n "${line}" ]; then
                echo "| ${pkg} | yes | $(awk '{print $2}' <<< "${line}") |"
              else
                echo "| ${pkg} | yes | - |"
              fi
            done < <(cat .sweep-present.txt 2>/dev/null || true)
            while IFS= read -r pkg; do
              echo "| ${pkg} | **no** | - |"
            done < <(cat .sweep-absent.txt 2>/dev/null || true)
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${fail}"
