name: vendor-check

# site/compose.mjs is vendored (a byte-for-byte copy) from aw-index-cli's
# canonical js/compose.mjs so the browse site's "repos builder" reuses the exact
# same registry -> .repos transform as the CLI. This job fails if the vendored
# copy drifts from the pinned upstream release, forcing a deliberate re-sync.
on:
  pull_request:
    paths:
      - site/compose.mjs
      - .github/workflows/vendor-check.yaml
  push:
    branches: [main]
    paths:
      - site/compose.mjs
      - .github/workflows/vendor-check.yaml

permissions:
  contents: read

env:
  # The aw-index-cli release site/compose.mjs is vendored from. Bump this in the
  # same PR that re-syncs site/compose.mjs to a newer version.
  COMPOSE_MJS_REF: v0.3.0

jobs:
  drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Compare site/compose.mjs against the pinned aw-index-cli release
        run: |
          url="https://raw.githubusercontent.com/autowarefoundation/aw-index-cli/${COMPOSE_MJS_REF}/js/compose.mjs"
          curl -fsSL "$url" -o /tmp/upstream-compose.mjs
          if ! diff -u /tmp/upstream-compose.mjs site/compose.mjs; then
            echo "::error::site/compose.mjs has drifted from aw-index-cli@${COMPOSE_MJS_REF} (js/compose.mjs). Re-copy the upstream file into site/compose.mjs (and bump COMPOSE_MJS_REF when moving to a new release)."
            exit 1
          fi
          echo "site/compose.mjs matches aw-index-cli@${COMPOSE_MJS_REF}"
