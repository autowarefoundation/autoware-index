name: test

# Unit tests for the pipeline scripts (scripts/) and the site generator
# (site/build.py). These guard the data contract — honest pass/fail status,
# schema-valid history records, the placeholder-maintainer guard, changed-ref
# detection, package.xml caching, and the site's last-green join.

on:
  pull_request:
    paths:
      - "scripts/**.py"
      - "site/**.py"
      - "tests/**.py"
      - "schema/**.json"
      - "pytest.ini"
      - ".github/workflows/test.yaml"
  push:
    branches: [main]
    paths:
      - "scripts/**.py"
      - "site/**.py"
      - "tests/**.py"
      - "schema/**.json"
      - "pytest.ini"
      - ".github/workflows/test.yaml"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: install test dependencies
        run: python -m pip install --upgrade pytest pyyaml jsonschema

      - name: run tests
        run: python -m pytest -q
