name: sweep-nightly

# Daily re-validation of every `kind: branch` package. Branch tips move under a
# fixed ref value, so a rolling ref needs periodic re-testing against the
# current latest published Autoware release (resolved inside sweep-package.yaml).
# Pinned tag/sha refs are immutable and are not swept here — the eager sweep
# already recorded them.
#
# Same discover -> validate -> record pipeline as sweep-eager.yaml. All sweep
# workflows that push to the orphan data branch share the `data-branch-write`
# concurrency group so they serialize rather than race.

on:
  schedule:
    - cron: '0 6 * * *'   # daily UTC
  workflow_dispatch:

concurrency:
  group: data-branch-write
  cancel-in-progress: false

permissions:
  contents: write    # required for the record job's push to the data branch

jobs:
  discover:
    name: discover branch refs
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-changes: ${{ steps.matrix.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Compute sweep matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix=$(scripts/sweep_nightly_matrix.py)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          rows=$(printf '%s' "$matrix" | python -c "import json,sys; print(len(json.load(sys.stdin).get('include', [])))")
          if [ "$rows" -gt 0 ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
            echo "::notice::nightly sweep dispatched for $rows branch ref(s)"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no branch refs registered; skipping validate + record"
          fi

  validate:
    needs: discover
    if: needs.discover.outputs.has-changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    uses: autowarefoundation/autoware-index-github-actions/.github/workflows/sweep-package.yaml@main
    with:
      ros_distro: ${{ matrix.ros_distro }}
      package_name: ${{ matrix.package_name }}
      package_repository: ${{ matrix.package_repository }}
      package_ref: ${{ matrix.ref_value }}

  record:
    name: record history
    needs: [discover, validate]
    # Run even if some validate matrix rows failed — we record failures too.
    if: always() && needs.discover.outputs.has-changes == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write    # push to the data branch
      actions: write     # trigger the pages workflow to rebuild the site
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml jsonschema

      - name: Download validation artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: validate-result-*
          path: validate-results/

      - name: Build envelopes
        env:
          MATRIX_JSON: ${{ needs.discover.outputs.matrix }}
        run: |
          set -euo pipefail
          printf '%s' "$MATRIX_JSON" > matrix.json
          scripts/build_envelopes.py \
            --matrix-file matrix.json \
            --results-dir validate-results \
            --sweep-kind nightly \
            --actions-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output envelopes.json
          cat envelopes.json

      - name: Append to data branch
        run: scripts/append_history.py --records envelopes.json

      - name: Trigger site rebuild
        # Best-effort: refresh the Pages site with the new records instead of
        # waiting for the daily pages schedule. Never fail the sweep over this.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yaml || echo "::warning::could not trigger pages rebuild"
