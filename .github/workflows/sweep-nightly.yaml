name: sweep-nightly

# Daily re-validation of every `kind: branch` repository (tips move under a
# fixed ref value), UNION the level-triggered state-diff as catch-up — any
# repository whose entry doesn't match its last conclusively-recorded
# data:state/ cursor (e.g. an eager run lost to cancellation) is swept here
# too. Pinned tag/sha repositories with an up-to-date cursor are not re-swept:
# their cells are immutable.
#
# Same discover -> validate -> record pipeline as sweep-eager.yaml; one matrix
# row per (distro, repository), per-package verdicts derived inside
# sweep-repository.yaml. Only the RECORD job serializes on the data branch
# (`data-branch-write`).

on:
  schedule:
    - cron: '0 6 * * *'   # daily UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: discover branch + stale repositories
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-changes: ${{ steps.matrix.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out data branch (state cursors)
        uses: actions/checkout@v7
        with:
          ref: data
          path: _data

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Compute sweep matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix=$(scripts/sweep_matrix.py --mode nightly --state-dir _data/state)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          rows=$(printf '%s' "$matrix" | python -c "import json,sys; print(len(json.load(sys.stdin).get('include', [])))")
          if [ "$rows" -gt 0 ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
            echo "::notice::nightly sweep dispatched for $rows repository row(s)"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no branch refs registered and no stale state; skipping validate + record"
          fi

  validate:
    needs: discover
    if: needs.discover.outputs.has-changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    uses: autowarefoundation/autoware-index-github-actions/.github/workflows/sweep-repository.yaml@main
    with:
      ros_distro: ${{ matrix.ros_distro }}
      repo_name: ${{ matrix.repo_name }}
      repository: ${{ matrix.repository }}
      ref_kind: ${{ matrix.ref_kind }}
      ref_value: ${{ matrix.ref_value }}
      packages: ${{ matrix.packages }}

  record:
    name: record history
    needs: [discover, validate]
    # Run even if some validate matrix rows failed — we record failures too.
    if: always() && needs.discover.outputs.has-changes == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: data-branch-write
      cancel-in-progress: false
    permissions:
      contents: write    # push to the data branch
      actions: write     # trigger the pages workflow to rebuild the site
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml jsonschema

      - name: Download validation artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: validate-result-*
          path: validate-results/

      - name: Build envelopes
        env:
          MATRIX_JSON: ${{ needs.discover.outputs.matrix }}
        run: |
          set -euo pipefail
          printf '%s' "$MATRIX_JSON" > matrix.json
          scripts/build_envelopes.py \
            --matrix-file matrix.json \
            --results-dir validate-results \
            --sweep-kind nightly \
            --actions-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output envelopes.json \
            --states-output states.json \
            --metadata-output staged-metadata
          cat envelopes.json

      - name: Append to data branch
        # History records, state cursors, and the package.xml metadata cache
        # land in ONE commit, so "state advanced" always implies "records landed".
        run: |
          scripts/append_history.py \
            --records envelopes.json \
            --states states.json \
            --metadata-dir staged-metadata

      - name: Trigger site rebuild
        # Best-effort: refresh the Pages site with the new records instead of
        # waiting for the daily pages schedule. Never fail the sweep over this.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yaml || echo "::warning::could not trigger pages rebuild"
