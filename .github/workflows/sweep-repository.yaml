name: sweep-repository

# One repository row resolves Autoware once, then calls separate build and
# test workflows. The resolve job also picks the image stage: core-devel-cuda
# when a package to build, or an index dependency of it, needs CUDA, else
# core-devel. Tests consume the exact cached workspace from that build.
# Both stages preserve the schema-2 validate-result artifact read by the
# post-merge recorder; PR runs retain read-only permissions and never record.

on:
  workflow_call:
    inputs:
      ros_distro:
        description: ROS 2 distribution (e.g. "jazzy").
        required: true
        type: string
      autoware_version:
        description: |
          Autoware SemVer (e.g. "1.8.0"). Drives the container tag.
          When empty (the default), the workflow falls back to the
          latest-autoware-version composite action: the freshest
          autoware release whose container image is already on GHCR.
          See .github/actions/latest-autoware-version/action.yaml. The
          recorder reads the resolved value from result.json.
        required: false
        type: string
        default: ""
      repo_name:
        description: Registry key of the repository entry (artifact + record identity).
        required: true
        type: string
      repository:
        description: Git URL of the repository to clone.
        required: true
        type: string
      ref_kind:
        description: "Registered ref kind: tag | sha | branch (recorded in result.json)."
        required: true
        type: string
      ref_value:
        description: Tag, branch, or SHA of repository to check out.
        required: true
        type: string
      packages:
        description: Space-separated registered ROS package names hosted by this repository.
        required: true
        type: string
      dependency_repositories:
        description: JSON array of transitive registered repository dependencies.
        required: false
        type: string
        default: "[]"
      dependency_packages:
        description: Space-separated registered package dependencies to build explicitly.
        required: false
        type: string
        default: ""
      index_dependencies:
        description: JSON mapping of registered package dependency edges.
        required: false
        type: string
        default: "{}"
      base_image_stage:
        description: |
          Container image stage (e.g. "core-devel" or "core-devel-cuda").
          When empty (the default), the resolve job clones the repository
          and its index dependencies and runs the detect-base-image-stage
          action of autoware-index-github-actions on the packages to build.
        required: false
        type: string
        default: ""
      runs-on:
        description: |
          Runner label as a JSON-encoded array (workaround for the lack
          of array inputs in workflow_call). Default: '["ubuntu-24.04"]'.
        required: false
        type: string
        default: '["ubuntu-24.04"]'

    outputs:
      resolved_sha:
        description: The exact commit SHA that was checked out and built.
        value: ${{ jobs.build.outputs.resolved_sha }}

permissions:
  contents: read

jobs:
  resolve:
    name: resolve image stage and autoware_version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      autoware_version: ${{ inputs.autoware_version || steps.latest.outputs.autoware_version }}
      base_image_stage: ${{ inputs.base_image_stage || steps.stage.outputs.base_image_stage }}
      source_sha: ${{ steps.clone.outputs.sha }}
    steps:
      - name: Clone repository and index dependencies
        id: clone
        if: inputs.base_image_stage == ''
        env:
          REPOSITORY: ${{ inputs.repository }}
          REF_VALUE: ${{ inputs.ref_value }}
          DEPENDENCY_REPOSITORIES: ${{ inputs.dependency_repositories }}
          GIT_LFS_SKIP_SMUDGE: "1"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          # The repository key rule of schema/distribution.schema.json. The
          # name becomes a directory, and this job has no checkout of the schema.
          REPO_NAME = re.compile(r"^[a-z][a-z0-9_-]*$")


          def clone(repository, ref, path):
              # git reads an argument that starts with "-" as an option.
              if repository.startswith("-") or ref.startswith("-"):
                  sys.exit(f"::error::refusing a repository or ref that starts with '-': {repository!r} {ref!r}")
              git = ["git", "-C", str(path)]
              path.mkdir(parents=True)
              subprocess.run(["git", "init", "--quiet", str(path)], check=True)
              subprocess.run([*git, "remote", "add", "origin", repository], check=True)
              # The detection reads only package.xml and CMake files, so one
              # commit is enough. Not every server gives a commit by SHA.
              # Then the full history is fetched.
              shallow = subprocess.run([*git, "fetch", "--quiet", "--depth", "1", "--end-of-options", "origin", ref], check=False)
              if shallow.returncode == 0:
                  subprocess.run([*git, "checkout", "--quiet", "FETCH_HEAD"], check=True)
                  return
              subprocess.run([*git, "fetch", "--quiet", "--tags", "origin", "+refs/heads/*:refs/remotes/origin/*"], check=True)
              subprocess.run([*git, "checkout", "--quiet", ref], check=True)


          def clone_or_exit(repository, ref, path):
              try:
                  clone(repository, ref, path)
              except subprocess.CalledProcessError:
                  sys.exit(f"::error::cannot clone {repository} at ref {ref!r}")


          clone_or_exit(os.environ["REPOSITORY"], os.environ["REF_VALUE"], Path("src") / "repository")
          dependencies = json.loads(os.environ["DEPENDENCY_REPOSITORIES"] or "[]") or []
          for dependency in dependencies:
              name = dependency["repo_name"]
              if not REPO_NAME.fullmatch(name):
                  sys.exit(f"::error::refusing an index dependency name that is not a registry key: {name!r}")
          for dependency in dependencies:
              path = Path("src") / "index-dependencies" / dependency["repo_name"]
              clone_or_exit(dependency["repository"], dependency["ref_value"], path)
          EOF
          # The build job checks out this commit, so the detection and the
          # build read the same sources of this repository when the ref is a
          # branch. An index dependency on a branch ref is not pinned.
          echo "sha=$(git -C src/repository rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Detect base image stage
        id: stage
        if: inputs.base_image_stage == ''
        uses: autowarefoundation/autoware-index-github-actions/.github/actions/detect-base-image-stage@main
        with:
          paths: src
          packages: ${{ inputs.packages }} ${{ inputs.dependency_packages }}

      - name: Resolve latest autoware_version
        id: latest
        if: inputs.autoware_version == ''
        uses: autowarefoundation/autoware-index-github-actions/.github/actions/latest-autoware-version@main
        with:
          ros_distro: ${{ inputs.ros_distro }}
          base_image_stage: ${{ inputs.base_image_stage || steps.stage.outputs.base_image_stage }}

  build:
    needs: resolve
    uses: ./.github/workflows/build-repository.yaml
    with:
      ros_distro: ${{ inputs.ros_distro }}
      autoware_version: ${{ needs.resolve.outputs.autoware_version }}
      repo_name: ${{ inputs.repo_name }}
      repository: ${{ inputs.repository }}
      ref_kind: ${{ inputs.ref_kind }}
      ref_value: ${{ inputs.ref_value }}
      checkout_ref: ${{ needs.resolve.outputs.source_sha }}
      packages: ${{ inputs.packages }}
      dependency_repositories: ${{ inputs.dependency_repositories }}
      dependency_packages: ${{ inputs.dependency_packages }}
      index_dependencies: ${{ inputs.index_dependencies }}
      base_image_stage: ${{ needs.resolve.outputs.base_image_stage }}
      runs-on: ${{ inputs.runs-on }}

  test:
    needs: [resolve, build]
    # A failed sibling must not prevent testing packages that built. The
    # explicit status function bypasses GitHub's implicit success() gate.
    if: ${{ !cancelled() && needs.build.outputs.has-tests == 'true' }}
    uses: ./.github/workflows/test-repository.yaml
    with:
      ros_distro: ${{ inputs.ros_distro }}
      autoware_version: ${{ needs.resolve.outputs.autoware_version }}
      repo_name: ${{ inputs.repo_name }}
      cache_key: ${{ needs.build.outputs.cache-key }}
      base_image_stage: ${{ needs.resolve.outputs.base_image_stage }}
      runs-on: ${{ inputs.runs-on }}
