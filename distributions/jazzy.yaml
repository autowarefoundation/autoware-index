# yaml-language-server: $schema=../schema/distribution.schema.json
# Autoware Index: jazzy distribution
#
# Repositories are first-class (schema_version 2): each entry owns one URL and
# ONE ref, and lists the registered packages it hosts under `packages:`.
# A monorepo registers several packages in one entry, all validated in
# lockstep at the repository's single ref.
#
# autoware_livox_tag_filter is registered against its `main` branch: the
# upstream repo has no tags/releases yet, so a branch ref is the only thing
# that resolves today. Switch to `kind: tag` once maintainers cut a release.

schema_version: "2"
ros_distro: jazzy

repositories:
  autoware_livox_tag_filter:
    url: https://github.com/autowarefoundation/autoware_livox_tag_filter
    ref:
      kind: branch
      value: main
    governance: community
    maintainers:
      - name: Ryohsuke Mitsudome
        email: ryohsuke.mitsudome@tier4.jp
        github: mitsudome-r
      - name: Kenzo Lobos-Tsunekawa
        email: kenzo.lobos@tier4.jp
        github: knzo25
    packages:
      autoware_livox_tag_filter:
        tags:
          - sensing
        description: >-
          Removes noise from a Livox lidar point cloud by dropping points whose
          Livox tag (spatial-position confidence, intensity confidence, and
          return number) is in a configurable ignore list.
  autoware_simple_planning_simulator:
    url: https://github.com/autowarefoundation/autoware_simple_planning_simulator
    ref:
      kind: branch
      value: main
    governance: foundation
    maintainers:
      - name: Junya Sasaki
        email: junya.sasaki@tier4.jp
        github: sasakisasaki
    packages:
      autoware_dummy_perception_publisher:
        tags:
          - perception
          - planning
          - simulator
      autoware_learning_based_vehicle_model:
        tags:
          - planning
          - control
          - simulator
      autoware_simple_planning_simulator:
        tags:
          - planning
          - simulator
