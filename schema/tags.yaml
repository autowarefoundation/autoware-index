# Autoware Index: the closed tag vocabulary for `packages.<name>.tags`
# in distributions/<distro>.yaml. SINGLE SOURCE OF TRUTH.
#
# Every tag used in the registry MUST be a live entry under `tags:` here;
# scripts/check_tags.py enforces it (validate.yaml + the check-tags
# pre-commit hook). Ids are flat lowercase hyphen-separated strings;
# the `group` field is display metadata for the browse site, never part
# of the id. An optional `label` is the chip text the site shows for the
# id (the id stays the stored key); optional `aliases` are search
# synonyms, valid in the site search and in `--tags` filters but NEVER in
# distributions/*.yaml (check_tags.py rejects them naming the canonical
# id). Live ids, deprecated ids, and aliases are pairwise disjoint.
#
# To add a tag (full criteria: CONTRIBUTING.md#package-tags), a PR
# editing this file must include:
#   1. a one-line `summary` a reviewer can apply without asking,
#   2. at least two named, registerable ROS packages that would carry it,
#   3. one sentence distinguishing it from each adjacent existing tag
#      (put it in `disambiguation` when the boundary is subtle).
#
# Ids are NEVER deleted or reused once published. To retire one, move it
# under `deprecated:` with `replaced_by:` naming live tags, and retag
# every usage in distributions/ in the SAME PR (CI rejects deprecated
# tags in the registry, forcing atomic migration).

groups:
  pipeline: Autonomy pipeline
  infrastructure: Infrastructure & support
  operations: Development & operations

tags:
  # --- Autonomy pipeline ---
  sensing:
    group: pipeline
    summary: Processes already-published sensor data (filtering, preprocessing, distortion correction).
    disambiguation: Talks to topics, not hardware; packages that talk to a device or vendor SDK are `driver`.
  perception:
    group: pipeline
    summary: Detection, tracking, prediction, and segmentation, turning sensor data into scene understanding.
  localization:
    group: pipeline
    summary: Ego-pose estimation (scan matching, pose fusion, GNSS integration, localization monitors).
  map:
    group: pipeline
    summary: Map loading, formats, projections, and map manipulation (lanelet2, point-cloud maps).
  planning:
    group: pipeline
    summary: Mission, behavior, and motion planning (route and trajectory generation).
  control:
    group: pipeline
    summary: Trajectory-following control and actuation command generation (MPC, pure pursuit).
  vehicle:
    group: pipeline
    summary: Vehicle-interface nodes, vehicle descriptions, and individual-parameter packages.
  system:
    group: pipeline
    summary: Runtime health (diagnostics aggregation, monitoring, MRM/fail-safe, command-mode arbitration).
  v2x:
    group: pipeline
    summary: Vehicle-to-everything communication (ETSI ITS stacks, V2I bridges and mocks).
  e2e-driving:
    group: pipeline
    label: End-to-end driving
    summary: A driving stack built around end-to-end AI models, from camera or sensor input to driving commands (hybrid architectures with a classical planner qualify).
    disambiguation: End-to-end SIMULATION is `simulator`; full-system integration testing is `testing`; a component-level learned model is `ml` plus its pipeline tag.
    aliases: [e2e, end-to-end, e2e-ai, end-to-end-ai]

  # --- Infrastructure & support ---
  common-library:
    group: infrastructure
    summary: Code other packages link or import (shared utils, math, geometry, CMake helpers).
    disambiguation: Executables you run are `tool`; IPC/executor infrastructure is `middleware`.
  middleware:
    group: infrastructure
    summary: Execution and transport infrastructure (IPC, executors, GPU memory transport, TF buffering).
  interface:
    group: infrastructure
    summary: Message, service, and action definitions (contracts only, no logic).
    disambiguation: The bridge node exposing an external surface is `api` (`autoware_adapi_msgs` is `interface`; its adaptor node is `api`).
  api:
    group: infrastructure
    summary: Adapter and bridge nodes exposing an external surface (AD API adaptors, REST/DDS bridges).
  launch:
    group: infrastructure
    summary: Packages whose primary deliverable is launch/parameter composition (the `*_launch` convention).
    disambiguation: Not for packages that merely ship a launch/ directory (nearly all do).
  driver:
    group: infrastructure
    summary: Talks to hardware or a vendor SDK (sensor/actuator drivers, CAN interfaces).
    disambiguation: Publishes raw device data; downstream processing of already-published data is `sensing`.
  ml:
    group: infrastructure
    label: AI / ML
    summary: Learned-model inference (TensorRT/ONNX runtimes, model artifacts, GPU deployment).
    disambiguation: Pairs with a pipeline tag; a learned detector is `perception` + `ml`.
    aliases: [ai, artificial-intelligence, deep-learning, dnn, neural-network]

  # --- Development & operations ---
  tool:
    group: operations
    summary: An executable developer utility you run.
    disambiguation: Code you link is `common-library`; rarely a package's only tag, so add the domain it serves.
  testing:
    group: operations
    summary: Software and scenario correctness checking (harnesses, scenario runners, fixtures).
    disambiguation: Metric/KPI computation is `evaluation`; the simulated world is `simulator`.
  simulator:
    group: operations
    summary: Provides a simulated environment or simulated sensor/vehicle data.
  visualization:
    group: operations
    summary: RViz plugins, viewers, and visual debugging displays.
  evaluation:
    group: operations
    summary: Metric/KPI computation (driving-quality scoring, benchmarking, runtime-performance analysis).
    disambiguation: "`testing` checks correctness; `simulator` provides the environment; `evaluation` scores the result."
  calibration:
    group: operations
    summary: Sensor and vehicle calibration tools and managers (intrinsic/extrinsic, time-delay, dynamics).

# Retired ids live here forever (append-only; never re-minted). Shape:
#   launcher:
#     replaced_by: [launch]
#     note: Renamed 2026-07 to match the ecosystem's *_launch convention (PR #NN).
deprecated: {}
